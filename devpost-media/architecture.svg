  <text x="418" y="535" font-family="'Segoe UI',system-ui,sans-serif" font-size="22">🤝</text>
  <text x="452" y="535" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#d8b4fe">Agent 4 · Reconciliation Broker</text>
  <text x="452" y="555" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6b7fb0">Merges team intent · proposes a single canonical definition · requires human approval</text>
  <rect x="840" y="513" width="148" height="20" rx="4" fill="#1a1f3a" stroke="#3a3f70" stroke-width="1"/>
  <text x="914" y="527" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#a855f7">Human-in-the-loop gate</text>
  <text x="452" y="575" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#4a5880">Output: Proposal object — canonical term + deprecated terms + affected assets</text>

  <!-- Arrow down -->
  <line x1="700" y1="591" x2="700" y2="613" stroke="#4b5680" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Agent 5: Writer ── -->
  <rect x="390" y="617" width="620" height="86" rx="12" fill="rgba(48,164,108,0.09)" stroke="#30a46c" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="418" y="648" font-family="'Segoe UI',system-ui,sans-serif" font-size="22">✍️</text>
  <text x="452" y="648" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#6ee7b7">Agent 5 · Writer</text>
  <text x="452" y="668" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6b7fb0">Upserts canonical GlossaryTerm · links assets · deprecates conflicting terms</text>
  <rect x="840" y="626" width="148" height="20" rx="4" fill="#1a1f3a" stroke="#1a4030" stroke-width="1"/>
  <text x="914" y="640" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#30a46c">Writes back to DataHub</text>
  <text x="452" y="688" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#4a5880">DataHub SDK · apply_proposal() · GlossaryTerm + lineage patch</text>

  <!-- ══ DATAHUB TARGET (right) ══ -->
  <rect x="1142" y="560" width="210" height="180" rx="16" fill="url(#dhGrad)" stroke="#30a46c" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="1247" y="590" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#30a46c" letter-spacing="2">DATAHUB</text>
  <text x="1247" y="610" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#3a8060" letter-spacing="1">GMS API · WRITE-BACK</text>
  <rect x="1162" y="624" width="162" height="22" rx="4" fill="#081a10" stroke="#1a4030" stroke-width="1"/>
  <circle cx="1174" cy="635" r="4" fill="#30a46c" fill-opacity="0.8"/>
  <text x="1185" y="639" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#4aaa70">Canonical term</text>
  <rect x="1162" y="653" width="162" height="22" rx="4" fill="#081a10" stroke="#1a4030" stroke-width="1"/>
  <circle cx="1174" cy="664" r="4" fill="#30a46c" fill-opacity="0.8"/>
  <text x="1185" y="668" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#4aaa70">Assets linked</text>
  <rect x="1162" y="682" width="162" height="22" rx="4" fill="#081a10" stroke="#1a4030" stroke-width="1"/>
  <circle cx="1174" cy="693" r="4" fill="#30a46c" fill-opacity="0.8"/>
  <text x="1185" y="697" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#4aaa70">Old terms deprecated</text>
  <rect x="1162" y="711" width="162" height="22" rx="4" fill="#081a10" stroke="#1a4030" stroke-width="1"/>
  <circle cx="1174" cy="722" r="4" fill="#30a46c" fill-opacity="0.8"/>
  <text x="1185" y="726" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#4aaa70">Graph consistent ✓</text>

  <!-- Arrow: Writer → DH target -->
  <line x1="1011" y1="660" x2="1138" y2="660" stroke="#30a46c" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrowGreen)"/>
  <text x="1070" y="652" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#30a46c" fill-opacity="0.7">WRITE</text>

