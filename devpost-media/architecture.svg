  <text x="452" y="329" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6b7fb0">Cross-domain semantic diffing — finds where the same term means different things</text>
  <rect x="840" y="287" width="148" height="20" rx="4" fill="#1a1f3a" stroke="#3a3f70" stroke-width="1"/>
  <text x="914" y="301" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#fb923c">5 conflicts · 88% confidence</text>
  <text x="452" y="349" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#4a5880">No LLM — deterministic structural graph analysis</text>

  <!-- Arrow down -->
  <line x1="700" y1="365" x2="700" y2="387" stroke="#4b5680" stroke-width="2" marker-end="url(#arrow)"/>

