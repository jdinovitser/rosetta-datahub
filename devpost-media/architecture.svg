  <text x="412" y="804" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#6b7fb0">No LLM in pipeline — deterministic structural analysis</text>
  <circle cx="400" cy="822" r="5" fill="#a855f7" fill-opacity="0.7"/>
  <text x="412" y="826" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#6b7fb0">Human-in-the-loop at Reconciliation gate</text>
