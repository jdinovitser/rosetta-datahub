<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="dhGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c8d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0098a8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="pipelineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#081428"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c8d8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5680"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00c8d8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#30a46c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="860" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  </pattern>
  <rect width="1400" height="860" fill="url(#grid)"/>

  <!-- ══ TITLE ══ -->
  <text x="700" y="58" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="36" font-weight="900" fill="url(#titleGrad)">Rosetta</text>
  <text x="700" y="88" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="400" fill="#8b9dc0" letter-spacing="3">AI DATA STEWARD · SYSTEM ARCHITECTURE</text>
  <line x1="500" y1="100" x2="900" y2="100" stroke="#1e3050" stroke-width="1"/>

  <!-- ══ DATAHUB SOURCE (left) ══ -->
  <rect x="48" y="280" width="210" height="300" rx="16" fill="url(#dhGrad)" stroke="#00c8d8" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="153" y="310" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#00c8d8" letter-spacing="2">DATAHUB</text>
  <text x="153" y="330" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#4a90b0" letter-spacing="1">GMS API · SOURCE</text>
  <!-- DH icon -->
  <circle cx="153" cy="375" r="28" fill="none" stroke="#00c8d8" stroke-width="1.5" stroke-opacity="0.4"/>
