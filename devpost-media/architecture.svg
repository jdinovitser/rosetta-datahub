  <text x="1247" y="178" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#5060a0" letter-spacing="1">Flask · Python</text>
  <rect x="1162" y="190" width="162" height="20" rx="4" fill="#10143a" stroke="#2a2f60" stroke-width="1"/>
  <text x="1243" y="204" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#818cf8">5-step walkthrough</text>
  <rect x="1162" y="216" width="162" height="20" rx="4" fill="#10143a" stroke="#2a2f60" stroke-width="1"/>
  <text x="1243" y="230" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#818cf8">Live DataHub connect</text>
  <rect x="1162" y="242" width="162" height="20" rx="4" fill="#10143a" stroke="#2a2f60" stroke-width="1"/>
  <text x="1243" y="256" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#818cf8">Export JSON/CSV/HTML</text>
  <rect x="1162" y="268" width="162" height="20" rx="4" fill="#10143a" stroke="#2a2f60" stroke-width="1"/>
  <text x="1243" y="282" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#818cf8">Offline demo mode</text>

  <!-- Arrow: Web UI → pipeline (bidirectional) -->
  <line x1="1142" y1="210" x2="1050" y2="210" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- ══ OFFLINE DATA SOURCE (bottom left) ══ -->
  <rect x="48" y="620" width="210" height="120" rx="16" fill="rgba(100,116,139,0.08)" stroke="#475569" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="153" y="648" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="2">OFFLINE MODE</text>
  <text x="153" y="666" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#4a5a70" letter-spacing="1">SQLite · Seed data</text>
  <rect x="68" y="678" width="170" height="20" rx="4" fill="#0e1520" stroke="#2a3040" stroke-width="1"/>
  <text x="153" y="692" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#64748b">55,500 patient records</text>
  <rect x="68" y="704" width="170" height="20" rx="4" fill="#0e1520" stroke="#2a3040" stroke-width="1"/>
  <text x="153" y="718" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#64748b">150,000 retail orders</text>

  <line x1="153" y1="620" x2="153" y2="582" stroke="#475569" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ══ LEGEND ══ -->
  <rect x="355" y="756" width="690" height="84" rx="12" fill="rgba(255,255,255,0.02)" stroke="#1e3050" stroke-width="1"/>
  <text x="700" y="776" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#3a5a8a" letter-spacing="2">KEY DESIGN DECISIONS</text>
