  <text x="452" y="442" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6b7fb0">Traverses lineage to map downstream assets · scores AI Readiness impact</text>
  <rect x="840" y="400" width="148" height="20" rx="4" fill="#1a1f3a" stroke="#3a3f70" stroke-width="1"/>
  <text x="914" y="414" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#ef4444">585 assets at risk</text>
  <text x="452" y="462" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#4a5880">Outputs: blast radius per conflict, AI Readiness score, dependency path</text>

  <!-- Arrow down -->
  <line x1="700" y1="478" x2="700" y2="500" stroke="#4b5680" stroke-width="2" marker-end="url(#arrow)"/>

