  <line x1="125" y1="375" x2="181" y2="375" stroke="#00c8d8" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Metadata items -->
  <rect x="72" y="415" width="162" height="22" rx="4" fill="#0a2240" stroke="#1a4060" stroke-width="1"/>
  <circle cx="84" cy="426" r="4" fill="#00c8d8" fill-opacity="0.7"/>
  <text x="95" y="430" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#7ab8d0">GlossaryTerms</text>
  <rect x="72" y="444" width="162" height="22" rx="4" fill="#0a2240" stroke="#1a4060" stroke-width="1"/>
  <circle cx="84" cy="455" r="4" fill="#00c8d8" fill-opacity="0.7"/>
  <text x="95" y="459" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#7ab8d0">Dataset Schemas</text>
  <rect x="72" y="473" width="162" height="22" rx="4" fill="#0a2240" stroke="#1a4060" stroke-width="1"/>
  <circle cx="84" cy="484" r="4" fill="#00c8d8" fill-opacity="0.7"/>
  <text x="95" y="488" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#7ab8d0">Lineage Graph</text>
  <rect x="72" y="502" width="162" height="22" rx="4" fill="#0a2240" stroke="#1a4060" stroke-width="1"/>
  <circle cx="84" cy="513" r="4" fill="#00c8d8" fill-opacity="0.7"/>
  <text x="95" y="517" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#7ab8d0">Ownership / Tags</text>
  <rect x="72" y="531" width="162" height="22" rx="4" fill="#0a2240" stroke="#1a4060" stroke-width="1"/>
  <circle cx="84" cy="542" r="4" fill="#00c8d8" fill-opacity="0.7"/>
  <text x="95" y="546" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#7ab8d0">Domain Metadata</text>

  <!-- Arrow: DH source → pipeline -->
  <line x1="260" y1="430" x2="348" y2="430" stroke="#00c8d8" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="6,3" marker-end="url(#arrowCyan)"/>
  <text x="300" y="422" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#00c8d8" fill-opacity="0.6">READ</text>

  <!-- ══ PIPELINE CONTAINER ══ -->
  <rect x="355" y="120" width="690" height="620" rx="20" fill="url(#pipelineGrad)" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="700" y="150" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#3a5a8a" letter-spacing="2">5-AGENT PIPELINE</text>

  <!-- ── Agent 1: Harvester ── -->
  <rect x="390" y="165" width="620" height="86" rx="12" fill="url(#agentGrad)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="418" y="196" font-family="'Segoe UI',system-ui,sans-serif" font-size="22">🧲</text>
  <text x="452" y="196" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#a5b4fc">Agent 1 · Harvester</text>
  <text x="452" y="216" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6b7fb0">Reads the full DataHub metadata graph — terms, schemas, lineage, ownership</text>
  <rect x="840" y="174" width="148" height="20" rx="4" fill="#1a1f3a" stroke="#3a3f70" stroke-width="1"/>
  <text x="914" y="188" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#818cf8">9 metrics · 3 teams · 2 marts</text>
  <text x="452" y="236" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#4a5880">Outputs: metric registry, ownership map, lineage graph</text>

  <!-- Arrow down -->
  <line x1="700" y1="252" x2="700" y2="274" stroke="#4b5680" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Agent 2: Conflict Detector ── -->
  <rect x="390" y="278" width="620" height="86" rx="12" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="1.5" stroke-opacity="0.6"/>
